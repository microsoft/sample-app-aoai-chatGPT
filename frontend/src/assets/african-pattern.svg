<!-- very small repeating SVG textile-inspired motif (keeps file tiny) -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#g)"/>
  <g fill="#ffb400" fill-opacity="0.06">
    <rect x="8" y="8" width="16" height="16" rx="2"/>
    <rect x="40" y="8" width="16" height="16" rx="2"/>
    <rect x="72" y="8" width="16" height="16" rx="2"/>
    <rect x="8" y="40" width="16" height="16" rx="2"/>
  </g>
  <g fill="#00c2a8" fill-opacity="0.04">
    <circle cx="98" cy="98" r="8"/>
    <circle cx="60" cy="60" r="6"/>
  </g>
  <path d="M0 120 L120 0" stroke="#000000" stroke-opacity="0.02" stroke-width="2"/>
</svg>
