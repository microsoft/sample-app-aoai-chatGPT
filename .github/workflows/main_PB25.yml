# This workflow builds and deploys your DOCKER container (your Python backend)
# This file is NOT the cause of the "build (14.x)" error.

name: Build and deploy Backend to Azure Web App - PB25

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Modern version

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3 # Modern version

    - name: Log in to Azure Container Registry (glgacr)
      uses: docker/login-action@v3 # Modern version
      with:
        registry: glgacr.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v5 # Modern version
      with:
        push: true
        # Pushes to the correct image name 'sample-app-aoai-chatgpt'
        # Uses github.sha (commit hash) as the unique tag
        tags: glgacr.azurecr.io/sample-app-aoai-chatgpt:${{ github.sha }}
        # Points to your Dockerfile
        file: ./WebApp.Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build # Ensures build job completes first
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Login to Azure
        uses: azure/login@v2 # Modern version
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }} # Assumes your secret is named AZURE_CREDENTIALS

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3 # Modern version
        with:
          app-name: 'PB25'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_adee204dfce442d18ffe6eca69cdda8e }}
          # Tells App Service to use the new image we just pushed
          images: 'glgacr.azurecr.io/sample-app-aoai-chatgpt:${{ github.sha }}'
