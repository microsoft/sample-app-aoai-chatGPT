name: Build, Push and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      IMAGE_TAG: ${{ steps.set_tag.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: set_tag
        run: |
          IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/intranettchatbot:${{ github.run_id }}
          docker build . --file WebApp.Dockerfile --tag $IMAGE_TAG
          docker push $IMAGE_TAG
          echo "::set-output name=IMAGE_TAG::$IMAGE_TAG"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Web App container
        run: |
          az webapp config container set \
            --name intranettchatbot \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ needs.build.outputs.IMAGE_TAG }} \
            --docker-registry-server-url https://ghcr.io \
            --docker-registry-server-user ${{ github.actor }} \
            --docker-registry-server-password ${{ secrets.GITHUB_TOKEN }}

      - name: Restart Azure Web App
        run: |
          az webapp restart --name intranettchatbot --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}

