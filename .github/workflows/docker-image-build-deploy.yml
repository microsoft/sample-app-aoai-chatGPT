name: Docker Image Build and Push to GHCR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - uses: actions/checkout@v3

      # Login to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push  Docker image
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/intranettchatbot:${{ github.run_id }}
          echo "Building Docker image: $IMAGE_TAG"
          docker build . --file WebApp.Dockerfile --tag $IMAGE_TAG
          docker push $IMAGE_TAG
          echo "Image pushed: $IMAGE_TAG"
          
  deploy:
      runs-on: ubuntu-latest
  
      steps:
        - name: Deploy Docker image to Azure Web App
          uses: azure/webapps-deploy@v2
          with:
            app-name: intranettchatbot 
            slot-name: Production
            images: ghcr.io/${{ github.repository_owner }}/intranettchatbot:${{ github.run_id }}
            publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
