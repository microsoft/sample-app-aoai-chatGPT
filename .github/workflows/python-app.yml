# =====================================================================
# Python CI Workflow for your Azure + Quart Application
# =====================================================================
# Runs:
#  - Unit tests on Linux & Windows (with dummy environment defaults)
#  - Integration tests on Linux (only if secrets are configured)
# =====================================================================

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# ---------------------------------------------------------------------
# ✅ Global defaults to avoid ValidationErrors (safe for dummy CI envs)
# ---------------------------------------------------------------------
env:
  AZURE_OPENAI_MODEL: dummy-deployment
  AZURE_OPENAI_ENDPOINT: https://example.openai.azure.com
  AZURE_OPENAI_PREVIEW_API_VERSION: 2024-08-01-preview
  AZURE_OPENAI_KEY: dummy
  CHAT_HISTORY__ACCOUNT: dummy
  CHAT_HISTORY__DATABASE: testdb
  CHAT_HISTORY__CONVERSATIONS_CONTAINER: testconvos
  DEBUG: "false"

# ---------------------------------------------------------------------
# 🧪 Job 1: Unit Tests (Linux)
# ---------------------------------------------------------------------
jobs:
  unit_linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          export PYTHONPATH=$(pwd)
          pytest -v --show-capture=stdout -k "not integration"

# ---------------------------------------------------------------------
# 🧪 Job 2: Unit Tests (Windows)
# ---------------------------------------------------------------------
  unit_windows:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests (Windows)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd"
          pytest -v --show-capture=stdout -k "not integration"

# ---------------------------------------------------------------------
# 🌐 Job 3: Integration Tests (only run if Azure secrets exist)
# ---------------------------------------------------------------------
  integration_linux:
    name: Integration tests (Linux with Azure secrets)
    runs-on: ubuntu-latest

    # Run only if critical secrets are defined
    if: ${{ secrets.AZUREOPENAIENDPOINT && secrets.AZUREOPENAIMODEL && secrets.AZUREOPENAIKEY }}

    env:
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZUREOPENAIENDPOINT }}
      AZURE_OPENAI_MODEL: ${{ secrets.AZUREOPENAIMODEL }}
      AZURE_OPENAI_KEY: ${{ secrets.AZUREOPENAIKEY }}
      AZURE_OPENAI_PREVIEW_API_VERSION: 2024-08-01-preview
      AZURE_OPENAI_EMBEDDING_NAME: ${{ secrets.AZUREOPENAIEMBEDDINGNAME }}

      AZURE_COSMOSDB_ACCOUNT: ${{ secrets.AZURECOSMOSDBACCOUNT }}
      AZURE_COSMOSDB_DATABASE: ${{ secrets.AZURECOSMOSDBDATABASE }}
      AZURE_COSMOSDB_CONVERSATIONS_CONTAINER: ${{ secrets.AZURECOSMOSDBCONVERSATIONSCONTAINER }}
      AZURE_COSMOSDB_ACCOUNT_KEY: ${{ secrets.AZURECOSMOSDBACCOUNTKEY }}

      AZURE_SEARCH_SERVICE: ${{ secrets.AZURESEARCHSERVICE }}
      AZURE_SEARCH_INDEX: ${{ secrets.AZURESEARCHINDEX }}
      AZURE_SEARCH_KEY: ${{ secrets.AZURESEARCHKEY }}
      AZURE_SEARCH_QUERY: ${{ secrets.AZURESEARCHQUERY }}

      ELASTICSEARCH_EMBEDDING_MODEL_ID: ${{ secrets.ELASTICSEARCHEMBEDDINGMODELID }}
      ELASTICSEARCH_ENCODED_API_KEY: ${{ secrets.ELASTICSEARCHENCODEDAPIKEY }}
      ELASTICSEARCH_ENDPOINT: ${{ secrets.ELASTICSEARCHENDPOINT }}
      ELASTICSEARCH_INDEX: ${{ secrets.ELASTICSEARCHINDEX }}
      ELASTICSEARCH_QUERY: ${{ secrets.ELASTICSEARCHQUERY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run full test suite (integration)
        run: |
          export PYTHONPATH=$(pwd)
          pytest -v --show-capture=stdout
