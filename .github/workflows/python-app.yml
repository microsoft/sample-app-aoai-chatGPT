# This workflow installs deps, then runs tests on Linux & Windows.
# It also provides sane DEFAULTS so Pydantic settings don't fail
# when repo secrets aren't present (CI-only dummy values).

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Feed secrets in (if set), but write DEFAULTS into $GITHUB_ENV for anything missing
      - name: Seed test environment (with safe defaults)
        shell: bash
        env:
          AZURE_OPENAI_ENDPOINT_S: ${{ secrets.AZUREOPENAIENDPOINT }}
          AZURE_OPENAI_MODEL_S: ${{ secrets.AZUREOPENAIMODEL }}
          AZURE_OPENAI_KEY_S: ${{ secrets.AZUREOPENAIKEY }}
          AZURE_OPENAI_EMBEDDING_NAME_S: ${{ secrets.AZUREOPENAIEMBEDDINGNAME }}

          AZURE_COSMOSDB_ACCOUNT_S: ${{ secrets.AZURECOSMOSDBACCOUNT }}
          AZURE_COSMOSDB_DATABASE_S: ${{ secrets.AZURECOSMOSDBDATABASE }}
          AZURE_COSMOSDB_CONTAINERS_S: ${{ secrets.AZURECOSMOSDBCONVERSATIONSCONTAINER }}
          AZURE_COSMOSDB_ACCOUNT_KEY_S: ${{ secrets.AZURECOSMOSDBACCOUNTKEY }}

          AZURE_SEARCH_SERVICE_S: ${{ secrets.AZURESEARCHSERVICE }}
          AZURE_SEARCH_INDEX_S: ${{ secrets.AZURESEARCHINDEX }}
          AZURE_SEARCH_KEY_S: ${{ secrets.AZURESEARCHKEY }}
          AZURE_SEARCH_QUERY_S: ${{ secrets.AZURESEARCHQUERY }}

          ELASTICSEARCH_EMBEDDING_MODEL_ID_S: ${{ secrets.ELASTICSEARCHEMBEDDINGMODELID }}
          ELASTICSEARCH_ENCODED_API_KEY_S: ${{ secrets.ELASTICSEARCHENCODEDAPIKEY }}
          ELASTICSEARCH_ENDPOINT_S: ${{ secrets.ELASTICSEARCHENDPOINT }}
          ELASTICSEARCH_INDEX_S: ${{ secrets.ELASTICSEARCHINDEX }}
          ELASTICSEARCH_QUERY_S: ${{ secrets.ELASTICSEARCHQUERY }}
        run: |
          # AOAI
          echo "AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT_S:-https://example.openai.azure.com}" >> $GITHUB_ENV
          echo "AZURE_OPENAI_PREVIEW_API_VERSION=2024-08-01-preview" >> $GITHUB_ENV
          echo "AZURE_OPENAI_MODEL=${AZURE_OPENAI_MODEL_S:-dummy-deployment}" >> $GITHUB_ENV
          echo "AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY_S:-dummy}" >> $GITHUB_ENV
          echo "AZURE_OPENAI_EMBEDDING_NAME=${AZURE_OPENAI_EMBEDDING_NAME_S:-text-embedding-3-small}" >> $GITHUB_ENV

          # Cosmos (dummy for CI)
          echo "AZURE_COSMOSDB_ACCOUNT=${AZURE_COSMOSDB_ACCOUNT_S:-dummy}" >> $GITHUB_ENV
          echo "AZURE_COSMOSDB_DATABASE=${AZURE_COSMOSDB_DATABASE_S:-testdb}" >> $GITHUB_ENV
          echo "AZURE_COSMOSDB_CONVERSATIONS_CONTAINER=${AZURE_COSMOSDB_CONTAINERS_S:-testconvos}" >> $GITHUB_ENV
          echo "AZURE_COSMOSDB_ACCOUNT_KEY=${AZURE_COSMOSDB_ACCOUNT_KEY_S:-dummy}" >> $GITHUB_ENV

          # Azure Cognitive Search (dummy for CI)
          echo "AZURE_SEARCH_SERVICE=${AZURE_SEARCH_SERVICE_S:-dummy}" >> $GITHUB_ENV
          echo "AZURE_SEARCH_INDEX=${AZURE_SEARCH_INDEX_S:-dummyindex}" >> $GITHUB_ENV
          echo "AZURE_SEARCH_KEY=${AZURE_SEARCH_KEY_S:-dummy}" >> $GITHUB_ENV
          echo "AZURE_SEARCH_QUERY=${AZURE_SEARCH_QUERY_S:-simple}" >> $GITHUB_ENV

          # Elasticsearch (dummy for CI)
          echo "ELASTICSEARCH_EMBEDDING_MODEL_ID=${ELASTICSEARCH_EMBEDDING_MODEL_ID_S:-text-embedding}" >> $GITHUB_ENV
          echo "ELASTICSEARCH_ENCODED_API_KEY=${ELASTICSEARCH_ENCODED_API_KEY_S:-dummy}" >> $GITHUB_ENV
          echo "ELASTICSEARCH_ENDPOINT=${ELASTICSEARCH_ENDPOINT_S:-https://example.es.local}" >> $GITHUB_ENV
          echo "ELASTICSEARCH_INDEX=${ELASTICSEARCH_INDEX_S:-dummyindex}" >> $GITHUB_ENV
          echo "ELASTICSEARCH_QUERY=${ELASTICSEARCH_QUERY_S:-embedding.predicted_value}" >> $GITHUB_ENV

          # Helpful for your code paths
          echo "DEBUG=false" >> $GITHUB_ENV

      - name: Test with pytest (with coverage)
        run: |
          export PYTHONPATH=$(pwd)
          coverage run -m pytest -v --show-capture=stdout
          coverage report -m --include=app.py,backend/*,tests/*
          coverage xml

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '50 80'

  test_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Seed test environment (with safe defaults)
        shell: pwsh
        env:
          AZURE_OPENAI_ENDPOINT_S: ${{ secrets.AZUREOPENAIENDPOINT }}
          AZURE_OPENAI_MODEL_S: ${{ secrets.AZUREOPENAIMODEL }}
          AZURE_OPENAI_KEY_S: ${{ secrets.AZUREOPENAIKEY }}
          AZURE_OPENAI_EMBEDDING_NAME_S: ${{ secrets.AZUREOPENAIEMBEDDINGNAME }}
        run: |
          $endpoint = if ($env:AZURE_OPENAI_ENDPOINT_S) { $env:AZURE_OPENAI_ENDPOINT_S } else { 'https://example.openai.azure.com' }
          $model    = if ($env:AZURE_OPENAI_MODEL_S) { $env:AZURE_OPENAI_MODEL_S } else { 'dummy-deployment' }
          $key      = if ($env:AZURE_OPENAI_KEY_S) { $env:AZURE_OPENAI_KEY_S } else { 'dummy' }
          $embed    = if ($env:AZURE_OPENAI_EMBEDDING_NAME_S) { $env:AZURE_OPENAI_EMBEDDING_NAME_S } else { 'text-embedding-3-small' }

          Add-Content -Path $env:GITHUB_ENV -Value "AZURE_OPENAI_ENDPOINT=$endpoint"
          Add-Content -Path $env:GITHUB_ENV -Value "AZURE_OPENAI_PREVIEW_API_VERSION=2024-08-01-preview"
          Add-Content -Path $env:GITHUB_ENV -Value "AZURE_OPENAI_MODEL=$model"
          Add-Content -Path $env:GITHUB_ENV -Value "AZURE_OPENAI_KEY=$key"
          Add-Content -Path $env:GITHUB_ENV -Value "AZURE_OPENAI_EMBEDDING_NAME=$embed"
          Add-Content -Path $env:GITHUB_ENV -Value "DEBUG=false"

      - name: Test with pytest (unit only on Windows)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd"
          pytest -v --show-capture=stdout -k "not integration"
