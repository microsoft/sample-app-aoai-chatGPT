# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - 454bc1b5-0c84-5ab2-9f42-59896559d600

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: sampleappaoaichatgpt2.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_FD6F5815870C4820ABF3CF2A59CB4568 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_5983F03A9A7546BDB823A686032A91F9 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: sampleappaoaichatgpt2.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_FD6F5815870C4820ABF3CF2A59CB4568 }}/sample-app-aoai-chatgpt2:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: '454bc1b5-0c84-5ab2-9f42-59896559d600'
          slot-name: 'Production'
          images: 'sampleappaoaichatgpt2.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_FD6F5815870C4820ABF3CF2A59CB4568 }}/sample-app-aoai-chatgpt2:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_04B5D12680444C16A09B22F7F153ADD7 }}