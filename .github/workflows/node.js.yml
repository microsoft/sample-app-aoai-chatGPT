# This workflow will install node dependencies (guarded), cache them, build the source and run tests across supported Node.js versions.
# It skips frontend steps if frontend/package.json is absent, and uses `npm ci` when a lockfile exists (falls back to `npm install` otherwise).
name: Build Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        # Use Node LTS releases; adjust the list if you need other versions.

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install frontend dependencies (skip if no frontend)
        run: |
          if [ -f ./frontend/package.json ]; then
            cd frontend
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              echo "Lockfile found — running npm ci"
              npm ci
            else
              echo "No lockfile found — running npm install"
              npm install
            fi
          else
            echo "No frontend/package.json found — skipping frontend install"
          fi

      - name: Build frontend (skip if no frontend)
        run: |
          if [ -f ./frontend/package.json ]; then
            cd frontend
            echo "Running build (if present)"
            npm run build --if-present
          else
            echo "No frontend/package.json found — skipping frontend build"
          fi

      - name: Run frontend tests (skip if no frontend)
        run: |
          if [ -f ./frontend/package.json ]; then
            cd frontend
            echo "Running tests (if present)"
            npm run test --if-present
          else
            echo "No frontend/package.json found — skipping frontend tests"
          fi
